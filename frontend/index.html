<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f5f7fb" />
		<title>Employee Management System</title>
		<link rel="stylesheet" href="/assets/css/styles.css" />
		<script type="module" src="/assets/js/app.js"></script>
	</head>
	<body>
		<div class="shell">
			<aside class="sidebar">
				<a class="brand" href="/">
					<span class="brand-mark">W</span>
					<span>Workwise<small>PEOPLE OPERATIONS</small></span>
				</a>
				<div class="side-caption">WORKSPACE</div>
				<nav id="navigation" aria-label="Main navigation"></nav>
				<div class="sidebar-bottom">
					<div class="account-card"><span class="avatar" id="avatar">?</span><div><strong id="account-name">Loading…</strong><small id="account-role">Verifying account</small></div></div>
					<button class="logout-button" id="logout">↪ <span>Sign out</span></button>
				</div>
			</aside>
			<main class="main">
				<header class="topbar"><button id="menu-toggle" class="icon-button" aria-label="Toggle navigation">☰</button><div id="breadcrumb">Workspace</div><span id="top-date"></span></header>
				<section class="content" id="view" aria-live="polite"><div class="loading-state">Loading your workspace…</div></section>
			</main>
		</div>
		<div class="toast" id="toast" role="status"></div>
		<dialog id="editor" class="dialog"><form id="editor-form" method="dialog"><div id="editor-body"></div><div class="dialog-actions"><button type="button" class="button button-light" id="cancel-editor">Cancel</button><button type="submit" class="button button-primary" id="save-editor">Save changes</button></div></form></dialog>
	</body>
</html>
